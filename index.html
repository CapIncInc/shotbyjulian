<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>shotbyjulian</title>
<meta name="description" content="A growing archive of street, car and detail photography by Julian." />
<meta name="theme-color" content="#000000" />
<meta property="og:title" content="shotbyjulian" />
<meta property="og:description" content="Street, cars and the details in between." />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ctext x='32' y='45' font-family='Helvetica,Arial,sans-serif' font-size='34' font-weight='600' fill='%23f5f5f7' text-anchor='middle'%3Ej%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<a class="skip" href="#archive">Skip to the archive</a>

<header class="nav" id="nav">
  <div class="nav__inner">
    <a class="nav__brand" href="#top">shotbyjulian</a>
    <nav class="nav__links" aria-label="Sections">
      <a href="#archive">Archive</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>

<main id="top">
  <section class="hero" id="hero">
    <div class="hero__stage">
      <div class="hero__media" id="heroMedia">
        <img id="heroImg" alt="" width="1200" height="1500" />
      </div>
      <div class="hero__copy">
        <p class="eyebrow">Photography</p>
        <h1 class="hero__title">shotbyjulian.</h1>
        <p class="hero__sub"><span id="photoCount">—</span> photographs. Street, cars and the details in between.</p>
      </div>
      <div class="hero__cue" aria-hidden="true"><span></span></div>
    </div>
  </section>

  <div class="chapters" id="chapters"></div>

  <section class="archive" id="archive">
    <div class="archive__head">
      <h2 class="archive__title">The archive</h2>
      <p class="archive__count"><span id="archiveCount">—</span> photographs</p>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="contact" id="contact">
    <p class="eyebrow">Contact</p>
    <a class="contact__mail" href="mailto:hello@shotbyjulian.com">hello@shotbyjulian.com</a>
    <p class="contact__note">Shoots, collaborations, prints.</p>
  </section>
</main>

<footer class="footer">
  <p>&copy; <span id="year">2026</span> shotbyjulian</p>
  <a href="#top">Back to top</a>
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photograph" hidden>
  <button class="lb__close" id="lbClose" type="button" aria-label="Close">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
  </button>
  <button class="lb__arrow lb__arrow--prev" id="lbPrev" type="button" aria-label="Previous photograph">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="lb__arrow lb__arrow--next" id="lbNext" type="button" aria-label="Next photograph">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <figure class="lb__figure">
    <img class="lb__img" id="lbImg" alt="" />
    <figcaption class="lb__foot">
      <span id="lbCaption"></span>
      <span class="lb__count" id="lbCount"></span>
    </figcaption>
  </figure>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/ScrollTrigger.min.js"></script>
<script src="app.js" type="module"></script>
</body>
</html>
